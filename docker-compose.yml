services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: src/Automation.Api/Dockerfile
    env_file: .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Database=automation;Username=app;Password=${DB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./backend
      dockerfile: src/Automation.Worker/Dockerfile
    env_file: .env
    environment:
      ConnectionStrings__Default: Host=db;Database=automation;Username=app;Password=${DB_PASSWORD}
    depends_on:
      api:
        condition: service_healthy   

  # 👈 NAYA NGROK SERVICE YAHAN ADD HUA HAI (Cloudflare tunnel ki jagah)
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "http://api:8080"
      - "--url=https://playlist-repacking-glutton.ngrok-free.dev" # Aapka free static domain
    environment:
      - NGROK_AUTHTOKEN=3Jc398X0t3OdXWD4IrXoyMn1Urt_DFtotL8iVVbCTUvxnkTU
    ports:
      - "4040:4040"
    depends_on:
      api:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: automation
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"        
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d automation"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: